name: Config lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: config-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image is the actionlint stage of .github/tools/Dockerfile, which the update bot keeps current
      - name: Lint workflows
        run: |
          image="$(awk -v stage=actionlint 'toupper($1) == "FROM" && toupper($3) == "AS" && $4 == stage { print $2 }' .github/tools/Dockerfile)"
          if [ -z "$image" ]; then
            echo "no stage named actionlint in .github/tools/Dockerfile" >&2
            exit 1
          fi
          docker run --rm -v "$PWD:/repo" -w /repo "$image" -color

  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows
        # the token lets the audits that ask GitHub about the actions in use run, such as the ones for known vulnerable
        # versions and for commits that are not on the branch they claim, which are skipped without it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="$(awk -v stage=zizmor 'toupper($1) == "FROM" && toupper($3) == "AS" && $4 == stage { print $2 }' .github/tools/Dockerfile)"
          if [ -z "$image" ]; then
            echo "no stage named zizmor in .github/tools/Dockerfile" >&2
            exit 1
          fi
          docker run --rm -e GH_TOKEN -v "$PWD:/repo" -w /repo "$image" \
            --no-progress --format github .

  names:
    name: File names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # ls-lint reads the names of the files and never opens one, the rules are in .ls-lint.yml
      - name: Check the names of the files
        env:
          # renovate: datasource=npm depName=@ls-lint/ls-lint
          version: 2.3.2
        run: npx --yes "@ls-lint/ls-lint@${version}"

  renovate:
    name: Renovate config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # A broken renovate.json does not fail anything by itself, the bot just stops opening dependency pull requests. The strict
      # mode also fails on an option that was renamed or removed, which the bot would only migrate with a warning
      - name: Validate renovate.json
        env:
          # renovate: datasource=npm depName=renovate
          version: 44.174.0
        run: npx --yes --package "renovate@${version}" renovate-config-validator --strict

name: Docker

# Never add workflow_call here. A workflow that calls this one would get signatures with the identity of this file on main, and
# the checks in the docs accept that identity.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  # A run that has started on main or on a tag is never cancelled. Cancelling it after the push has moved the tags but before
  # the image is scanned and signed would leave an unsigned image under them. A run that is still waiting is replaced by a newer
  # one, which is fine because only the newest commit on main matters for latest.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  image:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Docker Hub limits anonymous pulls per IP address and the runners share their addresses, so BuildKit asks the Google
          # mirror first and falls back to Docker Hub when the mirror does not have an image
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      # The upgrade step of the Dockerfile is cached by BuildKit, so a new day starts it again and takes the newest fixes of Alpine
      - name: Compute the date of the packages
        id: date
        run: echo "value=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # The image is built for the platform of the runner and kept in the local Docker, so the next steps can run and scan it.
      # The values of the build are public placeholders, because no test needs a real API.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # the build record is one more artifact for every run and nothing reads it
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          load: true
          push: false
          tags: aethera-frontend:ci
          build-args: |
            VITE_API_BASE_URL=https://api.example.com
            PACKAGES_DATE=${{ steps.date.outputs.value }}
          cache-from: type=gha
          # Only main writes the cache, because a cache that a pull request wrote can only be read by that same pull request
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}

      - name: Start the container
        run: |
          docker run -d --name app -p 8080:8080 --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true aethera-frontend:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs app
          echo "the container did not answer on /healthz in 30 seconds" >&2
          exit 1

      # Every check below is a behavior of the nginx config that the image ships, so a change to it is caught here
      - name: Check the behavior of the image
        run: |
          base=http://127.0.0.1:8080
          fail=0

          expect() {
            if [ "$2" != "$3" ]; then
              echo "FAIL $1, expected '$3' and got '$2'" >&2
              fail=1
            else
              echo "ok   $1"
            fi
          }

          asset="$(curl -fsS "$base/" | grep -o '/assets/[^"]*\.js' | head -1)"
          test -n "$asset"

          expect "the home page answers 200" "$(curl -s -o /dev/null -w '%{http_code}' "$base/")" 200
          expect "the home page has the root element" "$(curl -fsS "$base/" | grep -c 'id="root"')" 1
          expect "an unknown path serves the app" "$(curl -s -o /dev/null -w '%{http_code}' "$base/halaman-yang-tidak-ada")" 200
          expect "a missing asset is a 404" "$(curl -s -o /dev/null -w '%{http_code}' "$base/assets/does-not-exist.js")" 404
          expect "the health check answers 200" "$(curl -s -o /dev/null -w '%{http_code}' "$base/healthz")" 200
          expect "an asset is cached as immutable" "$(curl -sI "$base$asset" | tr -d '\r' | grep -i '^cache-control:' | tr '[:upper:]' '[:lower:]')" "cache-control: public, max-age=31536000, immutable"
          expect "a missing asset is not cached as immutable" "$(curl -sI "$base/assets/does-not-exist.js" | tr -d '\r' | grep -c -i 'immutable')" 0
          expect "the headers file of Pages is not served" "$(curl -s -o /dev/null -w '%{http_code}' "$base/_headers")" 404
          expect "the home page is revalidated" "$(curl -sI "$base/" | tr -d '\r' | grep -i '^cache-control:' | tr '[:upper:]' '[:lower:]')" "cache-control: public, max-age=0, must-revalidate"

          for path in / "$asset" /healthz /halaman-yang-tidak-ada /assets/does-not-exist.js /_headers; do
            expect "the security headers are on $path" "$(curl -sI "$base$path" | tr -d '\r' | grep -c -i -E '^(content-security-policy|x-content-type-options|referrer-policy|permissions-policy|strict-transport-security):')" 5
          done

          expect "the process is not root" "$(docker exec app id -u)" 101

          exit "$fail"

      - name: Show the container log
        if: ${{ failure() }}
        run: docker logs app

      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: aethera-frontend:ci
          severity: CRITICAL,HIGH
          # a vulnerability without a fix cannot be acted on, so it does not fail the build
          ignore-unfixed: true
          exit-code: '1'

  # The image is published from main and from version tags only. A pull request never gets a write token for packages, and the
  # preview of a pull request is the job of Cloudflare Pages. A manual run only publishes from main, because the signature
  # check accepts no other branch.
  publish:
    name: Publish image
    needs: image
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    env:
      # The published image is built for production. The values are public because they end up in the files of the app.
      VITE_API_BASE_URL: https://api-aethera.syafahadyan.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Anyone with write access can push a version tag on any commit until the release ruleset exists. A commit on main has been
      # through a pull request, so a tag on any other commit is refused and no image is built for it.
      - name: Check that a version tag is on main
        if: ${{ github.ref_type == 'tag' }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD

      - name: Compute the image name
        run: echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Compute the date of the packages
        id: date
        run: echo "value=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GHCR_IMAGE }}
          # A release makes two runs for the same commit, one for main and one for the tag. Both would move latest and the sha
          # tag, and the run that finishes last wins, so only main publishes them and a tag run only adds its version tags.
          # The default flavor adds latest to every semver tag by itself, so it is turned off and the raw tag below decides.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref_type != 'tag' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The last stage of the Dockerfile runs a command, so the arm64 image needs an emulator on an amd64 runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      # The image is pushed by digest and gets no tag here. The tags move only after the signature is verified, so a failure of
      # any step before that leaves an untagged image and never an unsigned image under latest or a version.
      - name: Build and push the image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # the build record is one more artifact for every run and nothing reads it
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            PACKAGES_DATE=${{ steps.date.outputs.value }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # The scope is its own, because the build job above writes the cache of a single platform under the default scope
          cache-from: type=gha,scope=publish
          # Only main writes the cache, because a tag can only read the cache of main
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=publish,mode=max' || '' }}

      # The build digest is the one of the index of both platforms. Each platform has an image of its own with its own digest,
      # and scanning that digest is the only way to be sure which of them Trivy looked at
      - name: Find the image of each platform
        id: platforms
        env:
          INDEX: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          manifest="$(docker buildx imagetools inspect "$INDEX" --raw)"
          for arch in amd64 arm64; do
            digest="$(jq -r --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' <<< "$manifest")"
            test -n "$digest"
            echo "$arch $digest"
            echo "$arch=$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The default bundle format of cosign 3 is stored as an OCI referrer, and GitHub Container Registry lists it under the wrong
      # type, so a plain cosign verify finds nothing. The classic format is a .sig tag that every registry and cosign version reads.
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes --use-signing-config=false --new-bundle-format=false "${GHCR_IMAGE}@${DIGEST}"

      # A signing step that did nothing useful would pass unnoticed, so check the signature against the identity of this workflow
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          identity="^https://github\.com/${REPOSITORY}/\.github/workflows/docker\.yaml@refs/(heads/main|tags/v.+)$"
          cosign verify \
            --new-bundle-format=false \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${GHCR_IMAGE}@${DIGEST}" > /dev/null

      - name: Add the tags to the signed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            version="${tag##*:}"
            # A floating tag such as 1 or 1.2 only moves when this release is the newest one of its line, so a run for an older
            # release that finishes last cannot move it back. The tag of the full version always moves.
            if [ "$GITHUB_REF_TYPE" = tag ] && [[ "$version" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
              newest="$(git tag -l "v${version}.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
              if [ "$newest" != "$GITHUB_REF_NAME" ]; then
                echo "skip $tag, the newest release of that line is $newest"
                continue
              fi
            fi
            args+=(--tag "$tag")
          done <<< "$TAGS"
          test "${#args[@]}" -gt 0
          docker buildx imagetools create "${args[@]}" "${GHCR_IMAGE}@${DIGEST}"

      # The SBOM and its attestation are made for each platform image, so the subject of an attestation is the image that the
      # SBOM describes
      - name: Generate the SBOM (amd64)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.GHCR_IMAGE }}@${{ steps.platforms.outputs.amd64 }}
          format: cyclonedx-json
          output-file: sbom-amd64.cdx.json
          artifact-name: sbom-amd64.cdx.json
          upload-artifact: true
          upload-artifact-retention: 14
          upload-release-assets: false

      - name: Attest the SBOM (amd64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.platforms.outputs.amd64 }}
          sbom-path: sbom-amd64.cdx.json

      - name: Generate the SBOM (arm64)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.GHCR_IMAGE }}@${{ steps.platforms.outputs.arm64 }}
          format: cyclonedx-json
          output-file: sbom-arm64.cdx.json
          artifact-name: sbom-arm64.cdx.json
          upload-artifact: true
          upload-artifact-retention: 14
          upload-release-assets: false

      - name: Attest the SBOM (arm64)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.platforms.outputs.arm64 }}
          sbom-path: sbom-arm64.cdx.json

      # These scans report to code scanning and do not fail the run. The image is already published and signed at this point, and
      # the Docker build job has failed the pull request on a fixed critical or high vulnerability before the merge.
      - name: Trivy image scan (amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.platforms.outputs.amd64 }}
          format: sarif
          output: trivy-image-amd64.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true

      - name: Upload Trivy results to code scanning (amd64)
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-image-amd64.sarif
          category: trivy-image-amd64

      - name: Trivy image scan (arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.platforms.outputs.arm64 }}
          format: sarif
          output: trivy-image-arm64.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true

      - name: Upload Trivy results to code scanning (arm64)
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-image-arm64.sarif
          category: trivy-image-arm64

name: Performance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  size:
    name: Bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      # the same public placeholder as the Docker build, so the built page does not stop at the check of the settings
      - name: Build
        env:
          VITE_API_BASE_URL: https://api.example.com
        run: npm run build

      # size-limit compresses each file of the build with Brotli and compares the total with the limit of .size-limit.json
      - name: Check the size of the bundle
        run: npm run size

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      # the same public placeholder as the Docker build, so the built page does not stop at the check of the settings
      - name: Build
        env:
          VITE_API_BASE_URL: https://api.example.com
        run: npm run build

      # The CLI runs from npx and not from the lockfile, because it pulls in an old Lighthouse and a large tree of packages that
      # the app does not need. The scores are asserted in .lighthouserc.json and the report stays on the runner as an artifact.
      - name: Run Lighthouse
        env:
          # renovate: datasource=npm depName=@lhci/cli
          version: 0.15.1
        run: npx --yes "@lhci/cli@${version}" autorun

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: lighthouse-report
          retention-days: 7
          if-no-files-found: warn

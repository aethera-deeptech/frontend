name: E2E all devices

# Runs the end to end tests on every device that Playwright knows, which are about 200 phones, tablets and desktop
# browsers. It is too slow for every pull request, so it runs once a week and on demand.
on:
  schedule:
    # Monday 03:00 UTC, which is 10:00 in Jakarta
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: e2e-devices-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  e2e-devices:
    name: E2E all devices
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Install the browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # The tests answer every call to this address themselves, see e2e/fixtures.ts
      - name: Build
        env:
          VITE_API_BASE_URL: https://api.example.com
        run: npm run build

      - name: Run the end to end tests on every device
        run: npm run test:e2e
        env:
          ALL_DEVICES: '1'

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-all-devices
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore

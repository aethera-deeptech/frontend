# The naming of the files of the repository, checked by the File names job of config.yaml and described in docs/ci-cd.md.
# A file name has no extension rule of its own when it has none at all, such as Dockerfile and LICENSE.
ls:
  # a folder is lowercase words joined by hyphens, and a leading dot marks the folder of a tool
  .dir: regex:\.?[a-z0-9]+(-[a-z0-9]+)*

  # every other file is the same, with dots for a variant such as vite-env.d.ts or button.test.tsx. This covers the .ts and .tsx files,
  # which are kebab case in the shadcn/ui convention
  .*: kebab-case

  # the community files in capitals such as README.md and CODE_OF_CONDUCT.md are allowed next to kebab case
  .md: kebab-case | SCREAMING_SNAKE_CASE

  # a YAML file ends with .yml, and the files that keep .yaml are listed in the ignore list below
  .yaml: exists:0

  # a workflow ends with .yaml and not .yml
  .github/workflows:
    .yml: exists:0
    .yaml: kebab-case

ignore:
  - .git
  - node_modules
  - dist
  - coverage
  - playwright-report
  - test-results
  # GitHub names the issue forms by what the person sees
  - .github/ISSUE_TEMPLATE
  # Vale names a style after its folder
  - .github/vale/styles
  # Trivy reads this exact name
  - .trivyignore.yaml
